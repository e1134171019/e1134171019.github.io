name: cinematic-3d-task12-e2e-verification

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/app/RuntimeApp.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/main.ts'
      - 'ci-mirror/cinematic-3d-character-website/vite.config.ts'
      - 'ci-mirror/cinematic-3d-character-website/playwright.config.ts'
      - 'ci-mirror/cinematic-3d-character-website/tests/e2e/**'
      - '.github/workflows/cinematic-3d-task12-e2e-verification.yml'
  workflow_dispatch:

jobs:
  task12-browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified executor-only nonfinal asset
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fsSL \
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/2bac6f8c57bf471df0d2a1e8a8ec023c7801dddf/Models/Box/glTF-Binary/Box.glb' \
            -o public/assets/test-character.glb
          echo 'ed52f7192b8311d700ac0ce80644e3852cd01537e4d62241b9acba023da3d54e  public/assets/test-character.glb' | sha256sum -c - | tee task12-asset-hash.log

      - name: Verify formal Task 12 source hashes
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          cat > task12-source-hashes.expected <<'EOF'
          ff78ee14ebde4bacc14df3028431819a88c5d84d78e48e1fd8c85dd7e1220006  src/app/RuntimeApp.ts
          76be4f1c00f4106bac1e1f5fa89564b5b0e58e4d05c1d92e4074220d556aff84  src/main.ts
          a1cf9e1c032df4b61428a2a5be68e322683f87e3455d679a7d4602fe81cee20c  vite.config.ts
          ad5f52521add6c5bce07dfce16fce7981f4f3dddfaaebd398679c2149ab3eb88  playwright.config.ts
          192d97a95fd0acf940f48fe27a64e782564089e14a947de4e0f4e3465988fd01  tests/e2e/runtime.spec.ts
          57677cd671f97b86d94d1c4a2bd333dbb89b63d08c51ba814041a19921243134  tests/e2e/focus-loss.spec.ts
          f9ab9ed47cb44be444b9bf0c97b52c0fd8dd0b51e7953e6c1527ed3441d69b77  tests/e2e/fallback.spec.ts
          EOF
          sha256sum -c task12-source-hashes.expected | tee task12-source-hashes.log

      - name: Install project dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --ignore-scripts

      - name: Full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee task12-unit-regression.log

      - name: Strict TypeScript and Vite production build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee task12-build.log

      - name: Install Playwright browser matrix
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Probe browser WebGL2 capability
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          cat > task12-webgl2-probe.mjs <<'EOF'
          import { chromium, firefox, webkit } from '@playwright/test';
          import fs from 'node:fs';
          const engines = { chromium, firefox, webkit };
          const results = {};
          for (const [name, engine] of Object.entries(engines)) {
            const browser = await engine.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('data:text/html,<html><body></body></html>');
            results[name] = await page.evaluate(() => {
              const canvas = document.createElement('canvas');
              const gl = canvas.getContext('webgl2', {
                alpha: false,
                antialias: true,
                depth: true,
                stencil: false,
                premultipliedAlpha: true,
                preserveDrawingBuffer: false,
                powerPreference: 'high-performance',
              });
              if (!gl) return { webgl2: false, version: null, renderer: null, vendor: null };
              const ext = gl.getExtension('WEBGL_debug_renderer_info');
              return {
                webgl2: true,
                version: gl.getParameter(gl.VERSION),
                renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
              };
            });
            await browser.close();
          }
          fs.writeFileSync('task12-webgl2-capability.json', `${JSON.stringify(results, null, 2)}\n`);
          console.log(JSON.stringify(results, null, 2));
          EOF
          node task12-webgl2-probe.mjs | tee task12-webgl2-capability.log
          node -e "const r=require('./task12-webgl2-capability.json'); if(!r.chromium.webgl2 || !r.webkit.webgl2) process.exit(1);"

      - name: Verify supported-browser runtime flows
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium 2>&1 | tee task12-chromium.log
          npx playwright test --project=webkit 2>&1 | tee task12-webkit.log

      - name: Verify Firefox explicit fallback path
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/fallback.spec.ts --project=firefox 2>&1 | tee task12-firefox-fallback.log

      - name: Run full three-browser matrix and classify executor blocker
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npx playwright test 2>&1 | tee task12-full-matrix.log
          status=${PIPESTATUS[0]}
          set -e
          firefox_webgl2=$(node -p "require('./task12-webgl2-capability.json').firefox.webgl2")
          if [ "$firefox_webgl2" = "true" ]; then
            if [ "$status" -ne 0 ]; then
              echo '{"status":"unexpected_failure","firefoxWebGL2":true}' > task12-matrix-contract.json
              exit 1
            fi
            echo '{"status":"full_matrix_pass","firefoxWebGL2":true}' > task12-matrix-contract.json
          else
            if [ "$status" -eq 0 ]; then
              echo '{"status":"unexpected_pass_without_firefox_webgl2","firefoxWebGL2":false}' > task12-matrix-contract.json
              exit 1
            fi
            echo '{"status":"environment_blocked_firefox_webgl2","firefoxWebGL2":false}' > task12-matrix-contract.json
          fi
          cat task12-matrix-contract.json

      - name: Upload Task 12 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task12-browser-verification-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task12-asset-hash.log
            ci-mirror/cinematic-3d-character-website/task12-source-hashes.expected
            ci-mirror/cinematic-3d-character-website/task12-source-hashes.log
            ci-mirror/cinematic-3d-character-website/task12-unit-regression.log
            ci-mirror/cinematic-3d-character-website/task12-build.log
            ci-mirror/cinematic-3d-character-website/task12-webgl2-capability.json
            ci-mirror/cinematic-3d-character-website/task12-webgl2-capability.log
            ci-mirror/cinematic-3d-character-website/task12-chromium.log
            ci-mirror/cinematic-3d-character-website/task12-webkit.log
            ci-mirror/cinematic-3d-character-website/task12-firefox-fallback.log
            ci-mirror/cinematic-3d-character-website/task12-full-matrix.log
            ci-mirror/cinematic-3d-character-website/task12-matrix-contract.json
            ci-mirror/cinematic-3d-character-website/test-results
            ci-mirror/cinematic-3d-character-website/playwright-report
          if-no-files-found: ignore
