name: MHR Human Carrier Gate

on:
  push:
    branches:
      - experiment/mhr-v1.0.1-human-carrier-gate
    paths:
      - .github/workflows/mhr-human-carrier-gate.yml
      - tools/experiments/mhr_human_gate.py
  workflow_dispatch:

jobs:
  build-human-carrier-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MHR CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymomentum-cpu
          python -m pip install "git+https://github.com/facebookresearch/MHR.git@v1.0.1" matplotlib trimesh

      - name: Download verified official MHR v1.0.1 assets
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/mhr-assets-v1.0.1.zip \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -f assets/lod1.fbx
          test -f assets/compact_v6_1.model

      - name: Execute MHR Human Carrier gate on CPU
        run: |
          python tools/experiments/mhr_human_gate.py

      - name: Preserve asset license when present
        run: |
          if [ -f LICENSE ]; then cp LICENSE artifacts/mhr-human-carrier-gate/MHR_CODE_LICENSE.txt; fi
          if [ -f assets/LICENSE ]; then cp assets/LICENSE artifacts/mhr-human-carrier-gate/MHR_ASSET_LICENSE.txt; fi
          find . -maxdepth 2 -iname 'LICENSE*' -print

      - name: Show generated artifacts
        run: |
          find artifacts/mhr-human-carrier-gate -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum artifacts/mhr-human-carrier-gate/* | tee artifacts/mhr-human-carrier-gate/SHA256SUMS.txt

      - name: Upload MHR Human Carrier gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhr-v1.0.1-human-carrier-gate
          path: artifacts/mhr-human-carrier-gate/
          if-no-files-found: error
          retention-days: 14
