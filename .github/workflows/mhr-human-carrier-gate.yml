name: MHR Human Carrier Gate

on:
  push:
    branches:
      - experiment/mhr-v1.0.1-human-carrier-gate
    paths:
      - .github/workflows/mhr-human-carrier-gate.yml
      - tools/experiments/mhr_fbx_gate_blender.py
  workflow_dispatch:

jobs:
  build-human-carrier-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Download verified official MHR v1.0.1 assets
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/mhr-assets-v1.0.1.zip \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -f assets/lod1.fbx
          find . -maxdepth 2 -iname 'LICENSE*' -print

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version

      - name: Execute MHR official FBX Human Carrier gate
        run: |
          blender --background --python tools/experiments/mhr_fbx_gate_blender.py

      - name: Preserve asset license
        run: |
          if [ -f assets/LICENSE ]; then
            cp assets/LICENSE artifacts/mhr-human-carrier-gate/MHR_ASSET_LICENSE.txt
          elif [ -f LICENSE ]; then
            cp LICENSE artifacts/mhr-human-carrier-gate/MHR_ASSET_LICENSE.txt
          else
            echo "No LICENSE found after verified v1.0.1 asset extraction" >&2
            exit 1
          fi

      - name: Show generated artifacts
        run: |
          find artifacts/mhr-human-carrier-gate -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum artifacts/mhr-human-carrier-gate/* | tee artifacts/mhr-human-carrier-gate/SHA256SUMS.txt

      - name: Upload MHR Human Carrier gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhr-v1.0.1-human-carrier-gate
          path: artifacts/mhr-human-carrier-gate/
          if-no-files-found: error
          retention-days: 14
