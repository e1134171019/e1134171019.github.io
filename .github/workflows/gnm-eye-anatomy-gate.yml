name: GNM Eye Anatomy Gate

on:
  push:
    branches:
      - experiment/gnm-head-eye-gate
    paths:
      - tools/experiments/gnm_eye_anatomy_gate.py
      - .github/workflows/gnm-eye-anatomy-gate.yml
  workflow_dispatch:

jobs:
  gnm-eye-anatomy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Acquire pinned official Google GNM v3 head
        run: |
          git clone --filter=blob:none https://github.com/google/GNM.git /tmp/GNM
          cd /tmp/GNM
          git checkout 98450b3c943101d5859ac1ceb7331ec918ebc321
          test "$(git rev-parse HEAD)" = "98450b3c943101d5859ac1ceb7331ec918ebc321"
          test -s gnm/shape/data/versions/v3_0/gnm_head.npz
          echo "868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055  gnm/shape/data/versions/v3_0/gnm_head.npz" | sha256sum -c -

      - name: Install Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2 python3-pil

      - name: Execute detailed eye anatomy gate
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GNM_MODEL: /tmp/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
        run: |
          blender --background --python tools/experiments/gnm_eye_anatomy_gate.py
          test -s artifacts/gnm-eye-anatomy-gate/gnm_eye_anatomy_metrics.json
          test -s artifacts/gnm-eye-anatomy-gate/gnm_v3_eye_anatomy_diagnostic.glb
          for f in \
            gnm_eye_layers_no_cornea_front.png \
            gnm_eye_layers_no_cornea_three_quarter.png \
            gnm_eye_layers_no_cornea_side.png \
            gnm_eye_layers_with_cornea_front.png \
            gnm_eye_layers_with_cornea_three_quarter.png \
            gnm_head_anatomy_front.png \
            gnm_head_anatomy_three_quarter.png \
            gnm_head_anatomy_side.png; do
            test -s "artifacts/gnm-eye-anatomy-gate/$f"
          done

      - name: Build contact sheet and preserve provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json, shutil
          out = Path('artifacts/gnm-eye-anatomy-gate')
          names = [
            'gnm_head_anatomy_front.png',
            'gnm_head_anatomy_three_quarter.png',
            'gnm_head_anatomy_side.png',
            'gnm_eye_layers_no_cornea_front.png',
            'gnm_eye_layers_no_cornea_three_quarter.png',
            'gnm_eye_layers_no_cornea_side.png',
            'gnm_eye_layers_with_cornea_front.png',
            'gnm_eye_layers_with_cornea_three_quarter.png',
          ]
          thumbs=[]
          for name in names:
              im=Image.open(out/name).convert('RGB').resize((420,420))
              c=Image.new('RGB',(420,455),'white'); c.paste(im,(0,35))
              ImageDraw.Draw(c).text((10,10),name.replace('.png',''),fill='black')
              thumbs.append(c)
          sheet=Image.new('RGB',(420*4,455*2),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*420,(i//4)*455))
          sheet.save(out/'00_gnm_eye_anatomy_contact_sheet.jpg',quality=94)
          shutil.copy('/tmp/GNM/LICENSE',out/'GNM_LICENSE_APACHE_2_0.txt')
          (out/'provenance.json').write_text(json.dumps({
              'repository':'google/GNM',
              'commit':'98450b3c943101d5859ac1ceb7331ec918ebc321',
              'npz_sha256':'868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055',
              'gate':'sclera + iris + pupil + cornea geometry separation; diagnostic materials only'
          },indent=2),encoding='utf-8')
          PY
          test -s artifacts/gnm-eye-anatomy-gate/00_gnm_eye_anatomy_contact_sheet.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: gnm-eye-anatomy-gate
          path: artifacts/gnm-eye-anatomy-gate/
          if-no-files-found: error
          retention-days: 14
