name: GNM MHR Appearance Gate

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - tools/experiments/gnm_mhr_appearance_gate.py
      - .github/workflows/gnm-mhr-appearance-gate.yml
  workflow_dispatch:

jobs:
  appearance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Acquire pinned Google GNM v3
        run: |
          git clone --filter=blob:none https://github.com/google/GNM.git /tmp/GNM
          cd /tmp/GNM
          git checkout 98450b3c943101d5859ac1ceb7331ec918ebc321
          test "$(git rev-parse HEAD)" = "98450b3c943101d5859ac1ceb7331ec918ebc321"
          echo "868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055  gnm/shape/data/versions/v3_0/gnm_head.npz" | sha256sum -c -

      - name: Acquire verified official MHR v1.0.1
        run: |
          curl -L --fail --retry 3 -o /tmp/mhr-assets-v1.0.1.zip https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -s assets/lod1.fbx

      - name: Install Blender lookdev runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2 python3-pil

      - name: Execute PBR skin micro-surface and layered-eye gate
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GNM_MODEL: /tmp/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
          MHR_FBX: assets/lod1.fbx
        run: |
          # The validated Head Bind Gate applies only the Armature Modifier. The source script
          # intentionally retains the original diagnostic parenting lines; remove them in the
          # execution workspace exactly as the verified v2 bind workflow does.
          sed -i '/head_obj.parent = arm/d' tools/experiments/gnm_mhr_head_bind_gate.py
          sed -i '/head_obj.parent_type = "OBJECT"/d' tools/experiments/gnm_mhr_head_bind_gate.py
          blender --background --python tools/experiments/gnm_mhr_appearance_gate.py
          test -s artifacts/gnm-mhr-appearance-gate/gnm_mhr_appearance_metrics.json
          test -s artifacts/gnm-mhr-appearance-gate/gnm_mhr_appearance_prototype.glb
          for f in \
            appearance_head_front.png \
            appearance_head_three_quarter.png \
            appearance_head_side.png \
            appearance_eye_front.png \
            appearance_eye_three_quarter.png \
            appearance_micro_grazing.png \
            appearance_bust_front.png \
            appearance_bust_three_quarter.png; do
            test -s "artifacts/gnm-mhr-appearance-gate/$f"
          done

      - name: Reject blank renders topology drift and missing eye layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json, math, struct
          out=Path('artifacts/gnm-mhr-appearance-gate')
          names=[
            'appearance_head_front.png','appearance_head_three_quarter.png','appearance_head_side.png',
            'appearance_eye_front.png','appearance_eye_three_quarter.png','appearance_micro_grazing.png',
            'appearance_bust_front.png','appearance_bust_three_quarter.png']
          for name in names:
              im=Image.open(out/name).convert('RGB')
              bg=im.getpixel((2,2))
              changed=sum(1 for r,g,b in im.getdata() if abs(r-bg[0])+abs(g-bg[1])+abs(b-bg[2])>24)
              if changed < 4500:
                  raise SystemExit(f'blank/near-blank appearance render: {name}, changed={changed}')
              stat=ImageStat.Stat(im)
              if max(stat.stddev) < 5.0:
                  raise SystemExit(f'near-flat appearance render: {name}, stddev={stat.stddev}')
          m=json.loads((out/'gnm_mhr_appearance_metrics.json').read_text())
          if m['uv']['triangle_uv_shape'][1:] != [3,2] or m['uv']['loops'] < 10000:
              raise SystemExit(f'GNM UV gate failed: {m["uv"]}')
          for k in ['skin','sclera','iris','pupil','cornea']:
              if int(m['face_partition_counts'].get(k,0)) <= 0:
                  raise SystemExit(f'missing semantic appearance layer: {k}')
          if m.get('final_cinematic_asset_claim') is not False:
              raise SystemExit('appearance prototype must not claim final cinematic asset')

          # Parse GLB JSON chunk to prove the rigged geometry/material structure still exports.
          data=(out/'gnm_mhr_appearance_prototype.glb').read_bytes()
          if data[:4] != b'glTF': raise SystemExit('invalid GLB magic')
          _,version,total=struct.unpack_from('<III',data,0)
          if version != 2 or total != len(data): raise SystemExit('invalid GLB header')
          off=12; doc=None
          while off < len(data):
              n,typ=struct.unpack_from('<II',data,off); off+=8
              chunk=data[off:off+n]; off+=n
              if typ == 0x4E4F534A:
                  doc=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'))
                  break
          if doc is None: raise SystemExit('GLB JSON missing')
          if len(doc.get('skins',[])) < 1: raise SystemExit('GLB lost MHR skin')
          if len(doc.get('materials',[])) < 5: raise SystemExit(f'GLB material count too low: {len(doc.get("materials",[]))}')
          if len(doc.get('meshes',[])) < 1: raise SystemExit('GLB mesh missing')
          print(json.dumps({'glb_skins':len(doc.get('skins',[])),'glb_materials':len(doc.get('materials',[])),'glb_meshes':len(doc.get('meshes',[]))},indent=2))
          PY

      - name: Build GPT review contact sheet and preserve provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,shutil
          out=Path('artifacts/gnm-mhr-appearance-gate')
          files=[
            'appearance_head_front.png','appearance_head_three_quarter.png','appearance_head_side.png','appearance_micro_grazing.png',
            'appearance_eye_front.png','appearance_eye_three_quarter.png','appearance_bust_front.png','appearance_bust_three_quarter.png']
          w=h=400
          sheet=Image.new('RGB',(w*4,(h+34)*2),'white')
          for i,name in enumerate(files):
              im=Image.open(out/name).convert('RGB').resize((w,h))
              tile=Image.new('RGB',(w,h+34),'white'); tile.paste(im,(0,34))
              ImageDraw.Draw(tile).text((8,9),name.replace('.png',''),fill='black')
              sheet.paste(tile,((i%4)*w,(i//4)*(h+34)))
          sheet.save(out/'00_gnm_mhr_appearance_contact_sheet.jpg',quality=95)
          shutil.copy('/tmp/GNM/LICENSE',out/'GNM_LICENSE_APACHE_2_0.txt')
          shutil.copy('assets/LICENSE.txt',out/'MHR_LICENSE_APACHE_2_0.txt')
          (out/'appearance_research_provenance.json').write_text(json.dumps({
            'gate':'offline physically-based look-dev on verified rigged GNM head: skin SSS/specular/roughness/micro bump + sclera/iris/pupil/cornea',
            'external_texture_bytes_imported':False,
            'candidate_sources':{
              '3DTextures Human Skin 001/002':{'license':'CC0','status':'candidate/reference; not imported in this gate'},
              'Pixar RenderMan Skin Material Presets':{'status':'shader architecture reference; not runtime dependency'},
              'FFHQ-UV-Intrinsics':{'license':'CC BY-NC-ND','status':'rejected from formal commercial route'}
            },
            'next_gate':'identity-resolved 4K/8K texture acquisition or generation + bake/export parity for glTF/WebGL'
          },indent=2),encoding='utf-8')
          PY
          test -s artifacts/gnm-mhr-appearance-gate/00_gnm_mhr_appearance_contact_sheet.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: gnm-mhr-appearance-gate
          path: artifacts/gnm-mhr-appearance-gate/
          if-no-files-found: error
          retention-days: 14
