name: cinematic-3d-task11-runtime-green

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/app/RuntimeApp.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/app/RuntimeApp.test.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/main.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/vite-env.d.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/styles.css'
      - '.github/workflows/cinematic-3d-task11-runtime-green.yml'
  workflow_dispatch:

jobs:
  task11-runtime-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified executor-only nonfinal asset
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fsSL \
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/2bac6f8c57bf471df0d2a1e8a8ec023c7801dddf/Models/Box/glTF-Binary/Box.glb' \
            -o public/assets/test-character.glb
          echo 'ed52f7192b8311d700ac0ce80644e3852cd01537e4d62241b9acba023da3d54e  public/assets/test-character.glb' | sha256sum -c - | tee task11-asset-hash-check.log

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 11 source identities
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '800dc5e4b6ee55bafbe91d6b30fe725843827fe0d153e0c7d437978bf8615c1d  src/app/RuntimeApp.ts'
            echo '12ed3c72fc75f349d0c758453264751a33cc803514fe92d5e27fb0c2ba6c1608  src/app/RuntimeApp.test.ts'
            echo '4e51d53aa154ae0ee42834fa3da7cbbc9d0e291e6fa63aa7680521414a2d983a  src/main.ts'
            echo '65996936fbb042915f7b74a200fcdde7e410f32a669b1ab9597cfaa4b0faddb5  src/vite-env.d.ts'
            echo 'c76eff35e2134b6409439e6377346e9095023ec258f5c5fe91562f89fecb164c  src/styles.css'
          } | sha256sum -c - | tee task11-source-hash-check.log

      - name: Run Task 11 targeted tests
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test -- src/app/RuntimeApp.test.ts 2>&1 | tee task11-targeted.log

      - name: Run full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee task11-full-regression.log

      - name: Run strict TypeScript and Vite build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee task11-build.log

      - name: Record Task 11 GREEN result
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          printf '{"green":true,"task11RuntimeTests":"pass","fullRegression":"pass","build":"pass","formalMain":true,"formalViteTypes":true,"verifiedNonfinalAsset":true}\n' > task11-green-result.json

      - name: Upload Task 11 GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task11-runtime-green-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task11-asset-hash-check.log
            ci-mirror/cinematic-3d-character-website/task11-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task11-targeted.log
            ci-mirror/cinematic-3d-character-website/task11-full-regression.log
            ci-mirror/cinematic-3d-character-website/task11-build.log
            ci-mirror/cinematic-3d-character-website/task11-green-result.json
          if-no-files-found: ignore
