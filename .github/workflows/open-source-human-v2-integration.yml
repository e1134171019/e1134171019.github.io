name: Open Source Human v2 - Integration

on:
  push:
    branches:
      - asset-integration/open-source-human-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Candidate manifest contract
        run: npx vitest run src/assets/AssetManifest.candidate.test.ts
