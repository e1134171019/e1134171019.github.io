name: MHR LOD0 Eye Gate

on:
  push:
    branches:
      - experiment/mhr-v1.0.1-cinematic-appearance-gate
    paths:
      - .github/workflows/mhr-lod0-eye-gate.yml
      - tools/experiments/mhr_lod0_eye_aperture_gate.py
  workflow_dispatch:

jobs:
  lod0-eye-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified official MHR v1.0.1 assets
        run: |
          curl -L --fail --retry 3 -o /tmp/mhr-assets-v1.0.1.zip https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -f assets/lod0.fbx
          test -f assets/LICENSE.txt
      - name: Install Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2
          blender --version
      - name: Execute LOD0 eye gate
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender --background --python tools/experiments/mhr_lod0_eye_aperture_gate.py
          test -s artifacts/mhr-lod0-eye-gate/mhr_lod0_eye_gate.json
          test -s artifacts/mhr-lod0-eye-gate/lod0_eye_micro_front.png
          test -s artifacts/mhr-lod0-eye-gate/lod0_eye_natural_front.png
          test -s artifacts/mhr-lod0-eye-gate/lod0_eye_open_front.png
      - name: Preserve license
        run: |
          cp assets/LICENSE.txt artifacts/mhr-lod0-eye-gate/MHR_ASSET_LICENSE.txt
          find artifacts/mhr-lod0-eye-gate -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: mhr-lod0-eye-gate
          path: artifacts/mhr-lod0-eye-gate/
          if-no-files-found: error
          retention-days: 14
