name: cinematic-3d-task5-asset

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/assets/**'
      - '.github/workflows/cinematic-3d-task5-asset.yml'
  workflow_dispatch:

jobs:
  task5-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only main mirror
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > src/main.ts <<'EOF'
          const app = document.querySelector<HTMLElement>('#app');

          if (!app) {
            throw new Error('Runtime root #app is missing.');
          }

          app.textContent = 'Runtime bootstrap pending';
          EOF

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify mirrored Task 5 source hashes
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          cat > task5-expected-source-sha256.txt <<'EOF'
          91420e4f4dcad132d9547c1a6fb6cb51fba1de9591ad3c259d69e588a05d35b2  src/assets/AssetManifest.ts
          b86c2719f0e24c438500976d66bff5581fd20c203d7d0093fad9528128c0a4cd  src/assets/AssetLoader.ts
          2d8eb3efb77b4a8af9b35d682617b24469077be6352770b559ea456648a51682  src/assets/AssetLoader.test.ts
          EOF
          sha256sum -c task5-expected-source-sha256.txt | tee task5-source-hash-check.log
          sha256sum src/assets/AssetManifest.ts src/assets/AssetLoader.ts src/assets/AssetLoader.test.ts > task5-source-sha256.txt

      - name: Materialize pinned official nonfinal GLB fixture
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          mkdir -p public/assets
          curl --fail --location --retry 2 --retry-delay 1 \
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/2bac6f8c57bf471df0d2a1e8a8ec023c7801dddf/Models/Box/glTF-Binary/Box.glb' \
            --output public/assets/test-character.glb
          echo 'ed52f7192b8311d700ac0ce80644e3852cd01537e4d62241b9acba023da3d54e  public/assets/test-character.glb' | sha256sum -c - | tee task5-asset-hash-check.log
          python - <<'PY' | tee task5-asset-integrity.txt
          from pathlib import Path
          import hashlib
          p = Path('public/assets/test-character.glb')
          data = p.read_bytes()
          assert data[:4] == b'glTF'
          assert int.from_bytes(data[4:8], 'little') == 2
          assert int.from_bytes(data[8:12], 'little') == len(data) == 1664
          git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git_blob == '95ec886b6b92b134291fd41d34ac9d5349306e0a'
          print(f'byte_length={len(data)}')
          print('gltf_version=2')
          print(f'git_blob_sha1={git_blob}')
          print(f'sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Run Task 5 targeted tests
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm test -- src/assets/AssetLoader.test.ts 2>&1 | tee task5-targeted-test.log

      - name: Run full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee task5-regression-test.log

      - name: Run strict TypeScript and Vite build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee task5-build.log

      - name: Create executor-only browser GLTFLoader smoke page
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > task5-smoke.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="UTF-8" /><title>Task 5 GLB smoke</title></head>
            <body data-task5="pending">
              <script type="module">
                import { loadRuntimeCharacterAsset } from '/src/assets/AssetLoader.ts';
                import { TEST_CHARACTER_ASSET_MANIFEST } from '/src/assets/AssetManifest.ts';

                try {
                  const asset = await loadRuntimeCharacterAsset(TEST_CHARACTER_ASSET_MANIFEST);
                  document.body.dataset.task5 = 'pass';
                  document.body.textContent = JSON.stringify({
                    status: 'pass',
                    assetId: asset.manifest.assetId,
                    finalAsset: asset.manifest.finalAsset,
                    equivalentToFinal: asset.manifest.equivalentToFinal,
                    rootType: asset.root.type,
                    clipCount: asset.clips.length,
                  });
                } catch (error) {
                  document.body.dataset.task5 = 'fail';
                  document.body.textContent = String(error);
                }
              </script>
            </body>
          </html>
          EOF

      - name: Run browser GLTFLoader smoke
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --version | tee task5-browser-version.txt
          npx vite --host 127.0.0.1 --port 4173 > task5-vite-runtime.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/task5-smoke.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --dump-dom \
            http://127.0.0.1:4173/task5-smoke.html \
            > task5-browser-smoke.html 2> task5-browser-stderr.log
          grep -q 'data-task5="pass"' task5-browser-smoke.html
          grep -q '"assetId":"khronos-box-nonfinal-loader-fixture"' task5-browser-smoke.html
          grep -q '"finalAsset":false' task5-browser-smoke.html
          printf '{"runtime_loader_smoke":"pass","fixture":"khronos-box-nonfinal-loader-fixture","finalAsset":false}\n' > task5-runtime-result.json

      - name: Record environment and final result
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          node --version > task5-environment.txt
          npm --version >> task5-environment.txt
          npm ls --depth=0 >> task5-environment.txt
          printf '{"targeted":"pass","regression":"pass","build":"pass","source_hash_match":true,"asset_integrity":"pass","browser_gltfloader_smoke":"pass"}\n' > task5-result.json

      - name: Upload Task 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task5-asset-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task5-targeted-test.log
            ci-mirror/cinematic-3d-character-website/task5-regression-test.log
            ci-mirror/cinematic-3d-character-website/task5-build.log
            ci-mirror/cinematic-3d-character-website/task5-source-sha256.txt
            ci-mirror/cinematic-3d-character-website/task5-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task5-asset-hash-check.log
            ci-mirror/cinematic-3d-character-website/task5-asset-integrity.txt
            ci-mirror/cinematic-3d-character-website/task5-browser-version.txt
            ci-mirror/cinematic-3d-character-website/task5-vite-runtime.log
            ci-mirror/cinematic-3d-character-website/task5-browser-smoke.html
            ci-mirror/cinematic-3d-character-website/task5-browser-stderr.log
            ci-mirror/cinematic-3d-character-website/task5-runtime-result.json
            ci-mirror/cinematic-3d-character-website/task5-environment.txt
            ci-mirror/cinematic-3d-character-website/task5-result.json
          if-no-files-found: ignore
