name: DRL GNM CPU Safe Fallback Gate

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - 'tools/experiments/drl_gnm_cpu_fallback_gate.py'
      - 'tools/experiments/transfer_ab_math.py'
      - '.github/workflows/drl-gnm-cpu-fallback-gate.yml'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Acquire pinned Google GNM v3
        run: |
          git clone --filter=blob:none https://github.com/google/GNM.git /tmp/GNM
          cd /tmp/GNM
          git checkout 98450b3c943101d5859ac1ceb7331ec918ebc321
          test "$(git rev-parse HEAD)" = "98450b3c943101d5859ac1ceb7331ec918ebc321"
          echo "868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055  gnm/shape/data/versions/v3_0/gnm_head.npz" | sha256sum -c -

      - name: Acquire DRL donor OBJ privately
        run: |
          mkdir -p /tmp/drl artifacts/drl-gnm-cpu-fallback-gate
          URL='https://www.digitalrealitylab.com/wp-content/uploads/SampleScans/Marcus_PBR_Sample_01.zip'
          curl -L --fail --retry 3 --retry-delay 3 -A 'Mozilla/5.0' -o /tmp/Marcus_PBR_Sample_01.zip "$URL"
          test "$(stat -c%s /tmp/Marcus_PBR_Sample_01.zip)" -eq 928494471
          sha256sum /tmp/Marcus_PBR_Sample_01.zip > artifacts/drl-gnm-cpu-fallback-gate/drl-source-archive-sha256.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/Marcus_PBR_Sample_01.zip')
          src='OBJ/Marcus_PBR_Sample_01.obj'
          info=z.getinfo(src)
          data=z.read(info)
          Path('/tmp/drl/Marcus_PBR_Sample_01.obj').write_bytes(data)
          print(src,len(data),f'{info.CRC:08x}')
          PY

      - name: Install CPU geometry runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1 libgles2

      - name: Execute safe CPU hybrid coverage gate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONPATH: ${{ github.workspace }}
          GNM_MODEL: /tmp/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
          DRL_OBJ: /tmp/drl/Marcus_PBR_Sample_01.obj
          COVERAGE_SIZE: '1024'
        run: |
          blender --background --python tools/experiments/drl_gnm_cpu_fallback_gate.py
          test -s artifacts/drl-gnm-cpu-fallback-gate/cpu_fallback_metrics.json
          test -s artifacts/drl-gnm-cpu-fallback-gate/expected_hockey_uv.png
          test -s artifacts/drl-gnm-cpu-fallback-gate/base_cpu_coverage.png
          test -s artifacts/drl-gnm-cpu-fallback-gate/fallback_accepted.png
          test -s artifacts/drl-gnm-cpu-fallback-gate/hybrid_coverage.png
          test -s artifacts/drl-gnm-cpu-fallback-gate/hybrid_comparison.png

      - name: Enforce fixed-threshold decision contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/drl-gnm-cpu-fallback-gate/cpu_fallback_metrics.json').read_text())
          print(json.dumps(m, indent=2))
          if m['base_bidirectional_ray']['absolute_delta_from_previous'] > 0.005:
              raise SystemExit('base CPU correspondence drifted from prior A/B result')
          f=m['fixed_nearest_fallback']
          if f['max_distance_mm'] != 15.0 or f['normal_angle_limit_deg'] != 60.0 or f['normal_abs_dot_floor'] != 0.5:
              raise SystemExit('fallback thresholds changed from pre-registered contract')
          if not f['thresholds_fixed_before_real_data_run']:
              raise SystemExit('fallback threshold provenance missing')
          if not m['hybrid']['pass_95pct']:
              raise SystemExit('fixed safe hybrid coverage remains below 95%')
          if m['hybrid']['selected_backend'] != 'CPU_HYBRID_RAY_NEAREST_CORRESPONDENCE':
              raise SystemExit('unexpected selected backend')
          if not m['hybrid']['real_diffuse_allowed_next']:
              raise SystemExit('hybrid passed but diffuse next gate is not unlocked')
          if m['source_protection']['raw_identity_texture_used']:
              raise SystemExit('identity texture must not be used in coverage gate')
          PY

      - name: Assert safe artifact contents
        if: always()
        run: |
          ! find artifacts/drl-gnm-cpu-fallback-gate -type f \( -iname '*.obj' -o -iname '*.fbx' -o -iname '*.ztl' -o -iname '*.exr' -o -iname '*.psd' \) | grep .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl-gnm-cpu-fallback-gate
          path: artifacts/drl-gnm-cpu-fallback-gate/
          retention-days: 14
