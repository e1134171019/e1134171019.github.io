name: cinematic-3d-task4-webgl2-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/scene/**'
      - '.github/workflows/cinematic-3d-task4-webgl2-smoke.yml'

jobs:
  task4-webgl2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only runtime smoke entry
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > src/main.ts <<'EOF'
          import { createRendererHandle } from './scene/Renderer';

          const app = document.querySelector<HTMLElement>('#app');

          if (!app) {
            throw new Error('Runtime root #app is missing.');
          }

          try {
            const handle = createRendererHandle({
              container: app,
              width: 640,
              height: 480,
              pixelRatio: 1,
            });

            handle.camera.position.set(0, 2.25, 5);
            handle.camera.lookAt(0, 0.75, 0);
            handle.renderer.render(handle.scene, handle.camera);

            const gl = handle.renderer.getContext();
            app.dataset.task4Smoke = 'pass';
            app.dataset.webglVersion = String(gl.getParameter(gl.VERSION));
            app.dataset.webglRenderer = String(gl.getParameter(gl.RENDERER));
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            const code =
              typeof error === 'object' && error !== null && 'code' in error
                ? String(error.code)
                : 'unknown';
            app.dataset.task4Smoke = 'fail';
            app.dataset.errorCode = code;
            app.dataset.errorMessage = message;
          }
          EOF

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Build actual renderer smoke entry
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee task4-webgl2-smoke-build.log

      - name: Locate preinstalled browser
        id: browser
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            printf '{"status":"blocked","reason":"preinstalled_browser_not_found"}\n' > task4-webgl2-smoke-result.json
            echo "No preinstalled Chrome/Chromium found."
            exit 2
          fi
          echo "path=$browser" >> "$GITHUB_OUTPUT"
          printf 'browser_path=%s\n' "$browser" > task4-webgl2-smoke-environment.txt

      - name: Serve smoke build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > task4-webgl2-smoke-server.log 2>&1 &
          echo $! > /tmp/task4-vite-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat task4-webgl2-smoke-server.log
          exit 1

      - name: Run headless WebGL2 and Three renderer smoke
        working-directory: ci-mirror/cinematic-3d-character-website
        env:
          TASK4_BROWSER_PATH: ${{ steps.browser.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee task4-webgl2-smoke.log
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({
            executablePath: process.env.TASK4_BROWSER_PATH,
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--enable-unsafe-swiftshader',
              '--use-angle=swiftshader-webgl',
            ],
          });

          try {
            const page = await browser.newPage({ viewport: { width: 800, height: 600 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-task4-smoke]', { timeout: 15000 });

            const result = await page.locator('#app').evaluate((element) => ({
              status: element.dataset.task4Smoke,
              webglVersion: element.dataset.webglVersion ?? null,
              webglRenderer: element.dataset.webglRenderer ?? null,
              errorCode: element.dataset.errorCode ?? null,
              errorMessage: element.dataset.errorMessage ?? null,
              userAgent: navigator.userAgent,
            }));

            fs.writeFileSync(
              'task4-webgl2-smoke-result.json',
              JSON.stringify(
                {
                  ...result,
                  executionClass: 'headless_software_gpu_smoke_only',
                  realGpuAcceptance: false,
                },
                null,
                2,
              ),
            );

            console.log(JSON.stringify(result, null, 2));
            if (result.status !== 'pass') {
              process.exitCode = 1;
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Stop smoke server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/task4-vite-preview.pid ]; then
            kill "$(cat /tmp/task4-vite-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload Task 4 browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task4-webgl2-smoke-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task4-webgl2-smoke-build.log
            ci-mirror/cinematic-3d-character-website/task4-webgl2-smoke-server.log
            ci-mirror/cinematic-3d-character-website/task4-webgl2-smoke.log
            ci-mirror/cinematic-3d-character-website/task4-webgl2-smoke-result.json
            ci-mirror/cinematic-3d-character-website/task4-webgl2-smoke-environment.txt
          if-no-files-found: ignore
