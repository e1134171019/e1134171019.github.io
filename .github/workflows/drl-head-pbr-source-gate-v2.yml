name: DRL Head PBR Source Gate v2

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - tools/experiments/drl_head_pbr_source_gate_v2.py
      - .github/workflows/drl-head-pbr-source-gate-v2.yml
  workflow_dispatch:

jobs:
  source-gate-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download official DRL archive and extract source inputs
        run: |
          mkdir -p /tmp/drl artifacts/drl-head-pbr-source-gate-v2
          URL='https://www.digitalrealitylab.com/wp-content/uploads/SampleScans/Marcus_PBR_Sample_01.zip'
          curl -L --fail --retry 3 --retry-delay 3 -A 'Mozilla/5.0' -o /tmp/Marcus_PBR_Sample_01.zip "$URL"
          test "$(stat -c%s /tmp/Marcus_PBR_Sample_01.zip)" -eq 928494471
          sha256sum /tmp/Marcus_PBR_Sample_01.zip > artifacts/drl-head-pbr-source-gate-v2/source-archive-sha256.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/Marcus_PBR_Sample_01.zip')
          wanted={'OBJ/Marcus_PBR_Sample_01.obj':'Marcus_PBR_Sample_01.obj','Textures/Marcus_38_diffuse.png':'Marcus_38_diffuse.png','Textures/Marcus_38_normal.png':'Marcus_38_normal.png','Textures/Marcus_38_glossiness.png':'Marcus_38_glossiness.png','Textures/Marcus_01_specular.png':'Marcus_01_specular.png'}
          for src,dst in wanted.items():
              info=z.getinfo(src); data=z.read(info); Path('/tmp/drl',dst).write_bytes(data); print(src,len(data),f'{info.CRC:08x}')
          PY

      - name: Install Blender and build 4K render proxies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil imagemagick libegl1 libgl1 libgles2
          identify /tmp/drl/Marcus_38_diffuse.png /tmp/drl/Marcus_38_normal.png /tmp/drl/Marcus_38_glossiness.png /tmp/drl/Marcus_01_specular.png | tee artifacts/drl-head-pbr-source-gate-v2/original-map-metadata.txt
          convert -limit memory 1024MiB -limit map 2048MiB /tmp/drl/Marcus_38_diffuse.png -resize '4096x4096>' /tmp/drl/diffuse_4k.png
          convert -limit memory 1024MiB -limit map 2048MiB /tmp/drl/Marcus_38_normal.png -resize '4096x4096>' /tmp/drl/normal_4k.png
          convert -limit memory 1024MiB -limit map 2048MiB /tmp/drl/Marcus_38_glossiness.png -resize '4096x4096>' /tmp/drl/gloss_4k.png
          cp /tmp/drl/Marcus_01_specular.png /tmp/drl/specular.png

      - name: Preserve current official source and usage page
        run: |
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o artifacts/drl-head-pbr-source-gate-v2/sample-model.html https://www.digitalrealitylab.com/sample-model/
          grep -Eqi 'commercial|personal' artifacts/drl-head-pbr-source-gate-v2/sample-model.html

      - name: Render exposure-corrected real DRL source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          DRL_OBJ: /tmp/drl/Marcus_PBR_Sample_01.obj
          DRL_DIFFUSE: /tmp/drl/diffuse_4k.png
          DRL_NORMAL: /tmp/drl/normal_4k.png
          DRL_GLOSS: /tmp/drl/gloss_4k.png
          DRL_SPECULAR: /tmp/drl/specular.png
        run: |
          blender --background --python tools/experiments/drl_head_pbr_source_gate_v2.py
          test -s artifacts/drl-head-pbr-source-gate-v2/drl_head_pbr_source_metrics.json
          for f in source_neg_y.png source_pos_y.png source_pos_x.png source_neg_x.png source_pos_z.png source_neg_z.png diagonal_0.png diagonal_1.png diagonal_2.png diagonal_3.png; do test -s "artifacts/drl-head-pbr-source-gate-v2/$f"; done

      - name: Reject dark blank or structurally invalid source renders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import json
          out=Path('artifacts/drl-head-pbr-source-gate-v2')
          names=['source_neg_y.png','source_pos_y.png','source_pos_x.png','source_neg_x.png','diagonal_0.png','diagonal_1.png','diagonal_2.png','diagonal_3.png']
          means=[]
          for name in names:
              im=Image.open(out/name).convert('RGB'); st=ImageStat.Stat(im); mean=sum(st.mean)/3; means.append(mean)
              bg=im.getpixel((2,2)); changed=sum(1 for p in im.getdata() if sum(abs(p[i]-bg[i]) for i in range(3))>24)
              if changed<5000 or max(st.stddev)<8: raise SystemExit(f'blank/flat {name}: changed={changed}, std={st.stddev}')
              if mean<28: raise SystemExit(f'underexposed {name}: mean={mean:.2f}')
          m=json.loads((out/'drl_head_pbr_source_metrics.json').read_text())
          head=[o for o in m['mesh_objects'] if o['name']==m['head_object']][0]
          if not head['uv_layers']: raise SystemExit('source head UV missing')
          z=max(m['head_bbox_m']['extent'])
          if not 0.25<=z<=0.50: raise SystemExit(f'physical scale gate failed: {z}')
          for k in ['diffuse','normal','glossiness','specular']:
              w,h=m['render_maps'][k]['size'];
              if min(w,h)<1024: raise SystemExit(f'map load failed {k}: {w}x{h}')
          print({'mean_luminance':means})
          PY

      - name: Build review contact sheet and assert no source redistribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          out=Path('artifacts/drl-head-pbr-source-gate-v2'); files=['source_neg_y.png','source_pos_y.png','source_pos_x.png','source_neg_x.png','source_pos_z.png','source_neg_z.png','diagonal_0.png','diagonal_1.png','diagonal_2.png','diagonal_3.png']; w=h=330
          sheet=Image.new('RGB',(w*5,(h+30)*2),'white')
          for i,f in enumerate(files):
              im=Image.open(out/f).convert('RGB').resize((w,h)); x=(i%5)*w; y=(i//5)*(h+30); sheet.paste(im,(x,y+30)); ImageDraw.Draw(sheet).text((x+6,y+8),f.replace('.png',''),fill='black')
          sheet.save(out/'00_drl_head_pbr_source_contact_sheet_v2.jpg',quality=95)
          PY
          ! find artifacts/drl-head-pbr-source-gate-v2 -type f \( -iname '*.obj' -o -iname '*diffuse*.png' -o -iname '*normal*.png' -o -iname '*gloss*.png' -o -iname '*specular*.png' -o -iname '*.ztl' \) | grep .
          test -s artifacts/drl-head-pbr-source-gate-v2/00_drl_head_pbr_source_contact_sheet_v2.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: drl-head-pbr-source-gate-v2
          path: artifacts/drl-head-pbr-source-gate-v2/
          if-no-files-found: error
          retention-days: 14
