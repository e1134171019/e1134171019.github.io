name: cinematic-3d-task2-input-red

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
  workflow_dispatch:

jobs:
  task2-input-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Run Task 2 RED test and reject false RED
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set +e
          npm test -- src/input/KeyboardInput.test.ts 2>&1 | tee task2-input-red.log
          test_exit=${PIPESTATUS[0]}
          set -e

          if [ "$test_exit" -eq 0 ]; then
            echo "Expected Task 2 RED test to fail, but it passed."
            exit 1
          fi

          if ! grep -Eq "(Cannot find module|Failed to resolve import|ERR_MODULE_NOT_FOUND).*(KeyboardInput|\\./KeyboardInput)" task2-input-red.log; then
            echo "Task 2 failure was not the intended missing KeyboardInput implementation; refusing false RED evidence."
            cat task2-input-red.log
            exit 1
          fi

          printf '{"expectedRed":true,"testExit":%s,"reason":"KeyboardInput implementation missing by design"}\n' "$test_exit" > task2-input-red-result.json

      - name: Upload Task 2 RED evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task2-input-red-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task2-input-red.log
            ci-mirror/cinematic-3d-character-website/task2-input-red-result.json
          if-no-files-found: error
