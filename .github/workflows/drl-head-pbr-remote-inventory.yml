name: DRL Head PBR Remote Inventory

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - .github/workflows/drl-head-pbr-remote-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current DRL wpdmdl route and inventory remote ZIP
        run: |
          mkdir -p artifacts/drl-head-pbr-inventory
          python3 - <<'PY'
          import json,re,struct,urllib.request
          from html import unescape
          from pathlib import Path
          page='https://www.digitalrealitylab.com/download/head-pbr-scan-sample/'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','ignore')
          Path('artifacts/drl-head-pbr-inventory/source-page.html').write_text(html,encoding='utf-8')
          # Resolve the live WordPress Download Manager route from the official page.
          matches=re.findall(r'''(?:https?://www\.digitalrealitylab\.com)?/download/head-pbr-scan-sample/\?wpdmdl=1039(?:&amp;|&)refresh=[^"'<>\s]+''',unescape(html),re.I)
          if not matches: raise RuntimeError('No live DRL wpdmdl=1039 route found')
          route=matches[0]
          if route.startswith('/'): route='https://www.digitalrealitylab.com'+route
          route=route.replace('&amp;','&')
          def get_range(a,b):
              q=urllib.request.Request(route,headers={'Range':f'bytes={a}-{b}','User-Agent':'Mozilla/5.0','Referer':page})
              with urllib.request.urlopen(q,timeout=90) as r: return r.read(),dict(r.headers),r.geturl()
          _,h,final=get_range(0,0)
          cr=h.get('Content-Range',''); m=re.search(r'/([0-9]+)$',cr)
          if not m: raise RuntimeError(f'DRL route is not a ranged binary: {h}')
          total=int(m.group(1)); tailn=min(total,4*1024*1024); tail,_,_=get_range(total-tailn,total-1)
          pos=tail.rfind(b'PK\x05\x06')
          if pos<0: raise RuntimeError('ZIP EOCD not found')
          _,disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment=struct.unpack('<4s4H2LH',tail[pos:pos+22])
          if n_total==0xffff or cd_size==0xffffffff or cd_off==0xffffffff: raise RuntimeError('Zip64 not handled')
          cd,_,_=get_range(cd_off,cd_off+cd_size-1)
          entries=[]; i=0
          while i<len(cd):
              if cd[i:i+4]!=b'PK\x01\x02': raise RuntimeError(f'Bad CD sig at {i}')
              v=struct.unpack('<4s6H3L5H2L',cd[i:i+46]); method,crc,csize,usize,fn,ex,co,local=v[4],v[7],v[8],v[9],v[10],v[11],v[12],v[16]
              name=cd[i+46:i+46+fn].decode('utf-8','replace')
              entries.append({'name':name,'compressed_size':csize,'uncompressed_size':usize,'method':method,'crc32':f'{crc:08x}','local_header_offset':local})
              i+=46+fn+ex+co
          if len(entries)!=n_total: raise RuntimeError(f'Entry count mismatch {len(entries)} != {n_total}')
          keys=('head','skin','face','albedo','basecolor','diff','normal','rough','gloss','spec','displace','height','ao','sss','trans','eye','teeth','tongue','.obj','.fbx','.blend','.max','.ztl','.tif','.tga','.jpg','.png','.exr')
          relevant=[e for e in entries if any(k in e['name'].lower() for k in keys)]
          report={'official_page':page,'resolved_route':route,'final_url':final,'zip_bytes':total,'entry_count':len(entries),'entries':entries,'relevant_entries':relevant}
          out=Path('artifacts/drl-head-pbr-inventory')
          (out/'inventory.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          (out/'relevant.txt').write_text('\n'.join(f"{e['uncompressed_size']:>12} m{e['method']} {e['name']}" for e in relevant),encoding='utf-8')
          print(f'DRL ZIP={total} entries={len(entries)} relevant={len(relevant)}')
          print((out/'relevant.txt').read_text()[:40000])
          PY
          test -s artifacts/drl-head-pbr-inventory/inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: drl-head-pbr-remote-inventory
          path: artifacts/drl-head-pbr-inventory/
          retention-days: 14
