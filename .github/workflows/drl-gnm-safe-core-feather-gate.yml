name: DRL GNM Safe Core Feather Gate

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - 'tools/experiments/drl_gnm_safe_core_feather_gate.py'
      - 'tools/experiments/drl_gnm_cpu_fallback_gate.py'
      - 'tools/experiments/transfer_ab_math.py'
      - '.github/workflows/drl-gnm-safe-core-feather-gate.yml'

permissions:
  contents: read

jobs:
  safe-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Acquire pinned Google GNM v3
        run: |
          git clone --filter=blob:none https://github.com/google/GNM.git /tmp/GNM
          cd /tmp/GNM
          git checkout 98450b3c943101d5859ac1ceb7331ec918ebc321
          test "$(git rev-parse HEAD)" = "98450b3c943101d5859ac1ceb7331ec918ebc321"
          echo "868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055  gnm/shape/data/versions/v3_0/gnm_head.npz" | sha256sum -c -

      - name: Acquire DRL donor OBJ privately
        run: |
          mkdir -p /tmp/drl artifacts/drl-gnm-safe-core-feather-gate
          URL='https://www.digitalrealitylab.com/wp-content/uploads/SampleScans/Marcus_PBR_Sample_01.zip'
          curl -L --fail --retry 3 --retry-delay 3 -A 'Mozilla/5.0' -o /tmp/Marcus_PBR_Sample_01.zip "$URL"
          test "$(stat -c%s /tmp/Marcus_PBR_Sample_01.zip)" -eq 928494471
          sha256sum /tmp/Marcus_PBR_Sample_01.zip > artifacts/drl-gnm-safe-core-feather-gate/drl-source-archive-sha256.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/Marcus_PBR_Sample_01.zip')
          src='OBJ/Marcus_PBR_Sample_01.obj'
          info=z.getinfo(src)
          data=z.read(info)
          Path('/tmp/drl/Marcus_PBR_Sample_01.obj').write_bytes(data)
          print(src,len(data),f'{info.CRC:08x}')
          PY

      - name: Install CPU geometry runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1 libgles2

      - name: Execute safe core and feather seam gate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONPATH: ${{ github.workspace }}
          GNM_MODEL: /tmp/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
          DRL_OBJ: /tmp/drl/Marcus_PBR_Sample_01.obj
          COVERAGE_SIZE: '1024'
        run: |
          blender --background --python tools/experiments/drl_gnm_safe_core_feather_gate.py
          test -s artifacts/drl-gnm-safe-core-feather-gate/safe_core_feather_metrics.json
          test -s artifacts/drl-gnm-safe-core-feather-gate/donor_valid_support.png
          test -s artifacts/drl-gnm-safe-core-feather-gate/safe_full_alpha_core.png
          test -s artifacts/drl-gnm-safe-core-feather-gate/feather_alpha.png
          test -s artifacts/drl-gnm-safe-core-feather-gate/base_only_region.png
          test -s artifacts/drl-gnm-safe-core-feather-gate/safe_core_feather_comparison.png

      - name: Enforce safe blend contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/drl-gnm-safe-core-feather-gate/safe_core_feather_metrics.json').read_text())
          print(json.dumps(m,indent=2))
          c=m['pre_registered_contract']
          if c['feather_width_pixels_at_1024'] != 16:
              raise SystemExit('feather width changed')
          if c['minimum_legal_donor_support_fraction'] != 0.90 or c['minimum_full_alpha_core_fraction'] != 0.50:
              raise SystemExit('pre-registered thresholds changed')
          s=m['safety_assertions']
          if any(s[k] != 0 for k in s):
              raise SystemExit(f'unsafe donor alpha assertion failed: {s}')
          if not m['decision']['pass']:
              raise SystemExit('safe facial core / feather blend contract failed')
          if m['decision']['selected_strategy'] != 'CPU_CORRESPONDENCE_SAFE_CORE_FEATHER_BLEND':
              raise SystemExit('unexpected strategy')
          if not m['decision']['real_diffuse_only_gate_allowed_next']:
              raise SystemExit('safe strategy passed but diffuse-only next gate not unlocked')
          PY

      - name: Assert no raw DRL identity asset is uploaded
        if: always()
        run: |
          ! find artifacts/drl-gnm-safe-core-feather-gate -type f \( -iname '*.obj' -o -iname '*.fbx' -o -iname '*.ztl' -o -iname '*.exr' -o -iname '*.psd' \) | grep .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl-gnm-safe-core-feather-gate
          path: artifacts/drl-gnm-safe-core-feather-gate/
          retention-days: 14
