name: cinematic-3d-task3-state-green

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
  workflow_dispatch:

jobs:
  task3-state-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only main mirror
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > src/main.ts <<'EOF'
          const app = document.querySelector<HTMLElement>('#app');

          if (!app) {
            throw new Error('Runtime root #app is missing.');
          }

          app.textContent = 'Runtime bootstrap pending';
          EOF

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Run Task 3 state tests
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm test -- src/state/state.test.ts 2>&1 | tee task3-state-test.log

      - name: Run full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm test 2>&1 | tee task3-regression-test.log

      - name: Run strict TypeScript and Vite build
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm run build 2>&1 | tee task3-build.log

      - name: Record source hashes and verification result
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          sha256sum \
            src/state/state.test.ts \
            src/state/CharacterState.ts \
            src/state/RuntimeState.ts \
            src/input/InputActions.ts \
            > task3-source-sha256.txt
          node --version > task3-environment.txt
          npm --version >> task3-environment.txt
          npm ls --depth=0 >> task3-environment.txt
          printf '{"green":true,"task3StateTests":"pass","fullRegression":"pass","typescriptAndBuild":"pass"}\n' > task3-state-green-result.json

      - name: Upload Task 3 GREEN evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task3-state-green-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task3-state-test.log
            ci-mirror/cinematic-3d-character-website/task3-regression-test.log
            ci-mirror/cinematic-3d-character-website/task3-build.log
            ci-mirror/cinematic-3d-character-website/task3-source-sha256.txt
            ci-mirror/cinematic-3d-character-website/task3-environment.txt
            ci-mirror/cinematic-3d-character-website/task3-state-green-result.json
            ci-mirror/cinematic-3d-character-website/dist
          if-no-files-found: error
