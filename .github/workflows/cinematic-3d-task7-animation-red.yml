name: cinematic-3d-task7-animation-red

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/character/AnimationCoordinator.test.ts'
      - '.github/workflows/cinematic-3d-task7-animation-red.yml'
  workflow_dispatch:

jobs:
  task7-animation-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 7 RED test source identity
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          echo '02ef5a840f0dfe34e60fee4a904361eed7ed2ccfa55311ea1790504e38c1739d  src/character/AnimationCoordinator.test.ts' | sha256sum -c - | tee task7-red-source-hash-check.log

      - name: Run Task 7 RED contract
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm test -- src/character/AnimationCoordinator.test.ts 2>&1 | tee task7-animation-red.log

      - name: Upload Task 7 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task7-animation-red-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task7-red-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task7-animation-red.log
          if-no-files-found: ignore
