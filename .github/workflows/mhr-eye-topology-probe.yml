name: MHR Eye Topology Probe

on:
  push:
    branches:
      - experiment/mhr-v1.0.1-cinematic-appearance-gate
    paths:
      - .github/workflows/mhr-eye-topology-probe.yml
      - tools/experiments/mhr_eye_topology_probe.py
      - tools/experiments/mhr_eye_patch_mask_probe.py
  workflow_dispatch:

jobs:
  probe-eye-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download verified official MHR v1.0.1 assets
        run: |
          curl -L --fail --retry 3 -o /tmp/mhr-assets-v1.0.1.zip https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -f assets/lod1.fbx
      - name: Install Blender import runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2
      - name: Probe native eye topology
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender --background --python tools/experiments/mhr_eye_topology_probe.py
          test -s artifacts/mhr-eye-topology-probe/mhr_eye_topology_probe.json
      - name: Render geometric eye patch masks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender --background --python tools/experiments/mhr_eye_patch_mask_probe.py
          test -s artifacts/mhr-eye-topology-probe/mhr_eye_patch_mask_probe.json
          test -s artifacts/mhr-eye-topology-probe/eye_mask_strict_front.png
          test -s artifacts/mhr-eye-topology-probe/eye_mask_broad_front.png
      - uses: actions/upload-artifact@v4
        with:
          name: mhr-eye-topology-probe
          path: artifacts/mhr-eye-topology-probe/
          if-no-files-found: error
          retention-days: 14
