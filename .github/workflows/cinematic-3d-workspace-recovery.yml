name: cinematic-3d-workspace-recovery

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - '.github/workflows/cinematic-3d-workspace-recovery.yml'
  workflow_dispatch:

jobs:
  recover-workspace-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Task 6 canonical mirror hashes
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          cat > recovery-expected-task6-sha256.txt <<'EOF'
          96f5980e2c6eb929e5c741a49feae59788f3773e418829b7a31b7e76ba95986b  src/character/CharacterController.ts
          b1c58d959be4066f9d605ba7fcb8cdb9e8732dadd7bc82207e98e071fd609c3c  src/character/CharacterController.test.ts
          EOF
          sha256sum -c recovery-expected-task6-sha256.txt | tee recovery-task6-hash-check.log

      - name: Create verified source manifest
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \
            ! -name 'recovery-expected-task6-sha256.txt' \
            ! -name 'recovery-task6-hash-check.log' \
            -print0 | sort -z | xargs -0 sha256sum > recovery-source-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > recovery-github-head.txt

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C ci-mirror -czf cinematic-3d-workspace-recovery.tar.gz cinematic-3d-character-website

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-workspace-recovery
          path: |
            cinematic-3d-workspace-recovery.tar.gz
            ci-mirror/cinematic-3d-character-website/recovery-source-sha256.txt
            ci-mirror/cinematic-3d-character-website/recovery-task6-hash-check.log
            ci-mirror/cinematic-3d-character-website/recovery-github-head.txt
          if-no-files-found: error
