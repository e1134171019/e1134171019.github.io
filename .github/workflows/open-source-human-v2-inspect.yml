name: Open Source Human v2 - Asset Inspection

on:
  push:
    branches:
      - asset-integration/open-source-human-v2
    paths:
      - .github/workflows/open-source-human-v2-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OpenGameArt archive format
        run: |
          set -euo pipefail
          url='https://opengameart.org/sites/default/files/basemesh_a1_human_yw_by_girush_2.7z'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o /tmp/humanoid.7z
          wc -c /tmp/humanoid.7z
          sha256sum /tmp/humanoid.7z
          mkdir -p /tmp/humanoid
          7z x -y -o/tmp/humanoid /tmp/humanoid.7z >/dev/null
          find /tmp/humanoid -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.blend' \) -printf '%s\t%p\n' | sort -n
      - name: Inspect Poly Pizza Man in Suit page
        run: |
          set -euo pipefail
          page='https://poly.pizza/m/mQnGoME1ez'
          curl --fail --location --retry 3 --retry-delay 2 "$page" -o /tmp/poly.html
          echo "html_bytes=$(wc -c < /tmp/poly.html)"
          echo '--- static.poly.pizza references ---'
          grep -Eo 'https?://[^"'"'"' <>]+' /tmp/poly.html | grep -E 'static\.poly\.pizza|\.glb|\.gltf|mQnGoME1ez' | sort -u || true
          echo '--- GLB/UUID/context references ---'
          grep -Eio '.{0,180}(mQnGoME1ez|static\.poly\.pizza|\.glb|\.gltf|download).{0,220}' /tmp/poly.html | head -n 120 || true
          echo '--- script sources ---'
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/poly.html | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u || true
