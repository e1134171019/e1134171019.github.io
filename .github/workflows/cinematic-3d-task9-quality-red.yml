name: cinematic-3d-task9-quality-red

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/quality/QualityPolicy.test.ts'
      - '.github/workflows/cinematic-3d-task9-quality-red.yml'
  workflow_dispatch:

jobs:
  task9-quality-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 9 RED test source identity
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          echo 'a9366fe74495d71359d890de1f2beeca29723cfd119e15446eb8c261905e4c1e  src/quality/QualityPolicy.test.ts' | sha256sum -c - | tee task9-red-source-hash-check.log

      - name: Run Task 9 RED contract
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test -- src/quality/QualityPolicy.test.ts 2>&1 | tee task9-quality-red.log

      - name: Upload Task 9 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task9-quality-red-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task9-red-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task9-quality-red.log
          if-no-files-found: ignore
