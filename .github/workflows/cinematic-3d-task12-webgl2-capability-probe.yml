name: cinematic-3d-task12-webgl2-capability-probe

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - '.github/workflows/cinematic-3d-task12-webgl2-capability-probe.yml'
  workflow_dispatch:

jobs:
  capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --ignore-scripts

      - name: Install Playwright browser matrix
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Probe WebGL2 capability without product runtime
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          cat > task12-webgl2-probe.mjs <<'EOF'
          import { chromium, firefox, webkit } from '@playwright/test';
          import fs from 'node:fs';

          const engines = { chromium, firefox, webkit };
          const results = {};

          for (const [name, engine] of Object.entries(engines)) {
            const browser = await engine.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('data:text/html,<html><body></body></html>');
            results[name] = await page.evaluate(() => {
              const canvas = document.createElement('canvas');
              const gl = canvas.getContext('webgl2', {
                alpha: false,
                antialias: true,
                depth: true,
                stencil: false,
                premultipliedAlpha: true,
                preserveDrawingBuffer: false,
                powerPreference: 'high-performance',
              });
              if (!gl) {
                return { webgl2: false, version: null, renderer: null, vendor: null };
              }
              const ext = gl.getExtension('WEBGL_debug_renderer_info');
              return {
                webgl2: true,
                version: gl.getParameter(gl.VERSION),
                renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
              };
            });
            await browser.close();
          }

          fs.writeFileSync('task12-webgl2-capability.json', `${JSON.stringify(results, null, 2)}\n`);
          console.log(JSON.stringify(results, null, 2));
          EOF
          node task12-webgl2-probe.mjs | tee task12-webgl2-capability.log

      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task12-webgl2-capability-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task12-webgl2-capability.json
            ci-mirror/cinematic-3d-character-website/task12-webgl2-capability.log
          if-no-files-found: error
