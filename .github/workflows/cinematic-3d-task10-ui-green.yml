name: cinematic-3d-task10-ui-green

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/ui/RuntimeOverlay.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/ui/RuntimeOverlay.test.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/styles.css'
      - '.github/workflows/cinematic-3d-task10-ui-green.yml'
  workflow_dispatch:

jobs:
  task10-ui-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only main mirror
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main.ts <<'EOF'
          import './styles.css';

          const app = document.querySelector<HTMLElement>('#app');

          if (!app) {
            throw new Error('Runtime root #app is missing.');
          }

          app.textContent = 'Task 10 build verification';
          EOF

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 10 source identities
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'd8ec677e704e63633ac5201de9724ce952a390db24565d03836cc8d21941cf78  src/ui/RuntimeOverlay.ts'
            echo '4a055d0a5f5b8c9c6011505d9c1ffc763c0bb3d224f2eddeb662f466327e9da8  src/ui/RuntimeOverlay.test.ts'
            echo '17d3e2359f825c5f44686499480dc930f2ba43c6b8e285652612570dde361c94  src/styles.css'
          } | sha256sum -c - | tee task10-source-hash-check.log

      - name: Run Task 10 targeted tests
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test -- src/ui/RuntimeOverlay.test.ts 2>&1 | tee task10-targeted.log

      - name: Run full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee task10-full-regression.log

      - name: Run strict TypeScript and Vite build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee task10-build.log

      - name: Record Task 10 GREEN result
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          printf '{"green":true,"task10UiTests":"pass","fullRegression":"pass","build":"pass","executorOnlyMain":true}\n' > task10-green-result.json

      - name: Upload Task 10 GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task10-ui-green-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task10-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task10-targeted.log
            ci-mirror/cinematic-3d-character-website/task10-full-regression.log
            ci-mirror/cinematic-3d-character-website/task10-build.log
            ci-mirror/cinematic-3d-character-website/task10-green-result.json
          if-no-files-found: ignore
