name: cinematic-3d-task11-runtime-red

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/app/RuntimeApp.test.ts'
      - '.github/workflows/cinematic-3d-task11-runtime-red.yml'
  workflow_dispatch:

jobs:
  task11-runtime-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 11 RED test identity
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          echo '12ed3c72fc75f349d0c758453264751a33cc803514fe92d5e27fb0c2ba6c1608  src/app/RuntimeApp.test.ts' | sha256sum -c - | tee task11-red-source-hash.log

      - name: Run Task 11 RED and validate intended failure
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm test -- src/app/RuntimeApp.test.ts > task11-red.log 2>&1
          status=$?
          set -e
          cat task11-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 11 RED unexpectedly passed.' >&2
            exit 1
          fi
          if ! grep -Eq 'RuntimeApp|Failed to resolve import.*RuntimeApp|Cannot find module.*RuntimeApp' task11-red.log; then
            echo 'Task 11 RED failed for an unexpected reason.' >&2
            exit 1
          fi
          printf '{"red":true,"expectedMissing":"RuntimeApp","testSha256":"12ed3c72fc75f349d0c758453264751a33cc803514fe92d5e27fb0c2ba6c1608"}\n' > task11-red-result.json

      - name: Upload Task 11 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task11-runtime-red-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task11-red-source-hash.log
            ci-mirror/cinematic-3d-character-website/task11-red.log
            ci-mirror/cinematic-3d-character-website/task11-red-result.json
          if-no-files-found: ignore
