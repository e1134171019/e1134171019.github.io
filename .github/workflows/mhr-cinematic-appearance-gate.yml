name: MHR Cinematic Appearance Gate

on:
  push:
    branches:
      - experiment/mhr-v1.0.1-cinematic-appearance-gate
    paths:
      - .github/workflows/mhr-cinematic-appearance-gate.yml
      - tools/experiments/mhr_cinematic_appearance_gate_blender.py
  workflow_dispatch:

jobs:
  build-cinematic-appearance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Download verified official MHR v1.0.1 assets
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/mhr-assets-v1.0.1.zip \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  /tmp/mhr-assets-v1.0.1.zip" | sha256sum -c -
          unzip -q /tmp/mhr-assets-v1.0.1.zip -d .
          test -f assets/lod1.fbx
          test -f assets/LICENSE.txt

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2
          blender --version
          ldconfig -p | grep 'libEGL.so.1'

      - name: Execute cinematic appearance prototype
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender --background --python tools/experiments/mhr_cinematic_appearance_gate_blender.py
          test -s artifacts/mhr-cinematic-appearance-gate/appearance_metrics.json
          test -s artifacts/mhr-cinematic-appearance-gate/mhr_v1.0.1_cinematic_appearance_prototype.glb
          test -s artifacts/mhr-cinematic-appearance-gate/view_000.png
          test -s artifacts/mhr-cinematic-appearance-gate/face_000.png

      - name: Verify exported GLB contract
        run: |
          python3 - <<'PY'
          import json, struct
          p='artifacts/mhr-cinematic-appearance-gate/mhr_v1.0.1_cinematic_appearance_prototype.glb'
          with open(p,'rb') as f:
              magic,version,total=struct.unpack('<4sII',f.read(12))
              assert magic == b'glTF' and version == 2
              chunk_len,chunk_type=struct.unpack('<II',f.read(8))
              doc=json.loads(f.read(chunk_len).decode('utf-8').rstrip('\x00 '))
          assert len(doc.get('skins',[])) >= 1, 'missing skin'
          assert len(doc.get('materials',[])) >= 5, 'appearance materials missing'
          assert len(doc.get('meshes',[])) >= 1, 'mesh missing'
          targets=sum(len(p.get('targets',[])) for m in doc.get('meshes',[]) for p in m.get('primitives',[]))
          assert targets >= 100, f'morph target regression: {targets}'
          print(json.dumps({
              'nodes':len(doc.get('nodes',[])),
              'meshes':len(doc.get('meshes',[])),
              'skins':len(doc.get('skins',[])),
              'materials':len(doc.get('materials',[])),
              'morph_targets':targets,
              'bytes':total,
          }, indent=2))
          PY

      - name: Preserve license and hashes
        run: |
          cp assets/LICENSE.txt artifacts/mhr-cinematic-appearance-gate/MHR_ASSET_LICENSE.txt
          find artifacts/mhr-cinematic-appearance-gate -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum artifacts/mhr-cinematic-appearance-gate/* | tee artifacts/mhr-cinematic-appearance-gate/SHA256SUMS.txt

      - name: Upload cinematic appearance gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhr-v1.0.1-cinematic-appearance-gate
          path: artifacts/mhr-cinematic-appearance-gate/
          if-no-files-found: error
          retention-days: 14
