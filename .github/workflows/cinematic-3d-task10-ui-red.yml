name: cinematic-3d-task10-ui-red

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/ui/RuntimeOverlay.test.ts'
      - '.github/workflows/cinematic-3d-task10-ui-red.yml'
  workflow_dispatch:

jobs:
  task10-ui-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify Task 10 RED source identity
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          echo '4a055d0a5f5b8c9c6011505d9c1ffc763c0bb3d224f2eddeb662f466327e9da8  src/ui/RuntimeOverlay.test.ts' | sha256sum -c - | tee task10-red-source-hash-check.log

      - name: Confirm intended RED
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test -- src/ui/RuntimeOverlay.test.ts > task10-red-test.log 2>&1
          test_exit=$?
          set -e
          cat task10-red-test.log
          if [ "$test_exit" -eq 0 ]; then
            echo 'Expected RED but test passed.' >&2
            exit 1
          fi
          if ! grep -Eq 'Failed to resolve import "\./RuntimeOverlay"|Cannot find module.*RuntimeOverlay|RuntimeOverlay.*does not exist' task10-red-test.log; then
            echo 'Failure was not the intended missing RuntimeOverlay implementation.' >&2
            exit 1
          fi
          printf '{"expectedRed":true,"testExit":%s,"reason":"RuntimeOverlay implementation missing by design"}\n' "$test_exit" > task10-red-result.json

      - name: Upload Task 10 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task10-ui-red-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task10-red-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task10-red-test.log
            ci-mirror/cinematic-3d-character-website/task10-red-result.json
          if-no-files-found: ignore
