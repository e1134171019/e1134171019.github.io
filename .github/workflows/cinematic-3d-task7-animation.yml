name: cinematic-3d-task7-animation

on:
  push:
    branches:
      - runtime-bootstrap/cinematic-3d
    paths:
      - 'ci-mirror/cinematic-3d-character-website/src/character/AnimationCoordinator.ts'
      - 'ci-mirror/cinematic-3d-character-website/src/character/AnimationCoordinator.test.ts'
      - '.github/workflows/cinematic-3d-task7-animation.yml'
  workflow_dispatch:

jobs:
  task7-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate executor-only main mirror
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > src/main.ts <<'EOF'
          const app = document.querySelector<HTMLElement>('#app');
          if (!app) throw new Error('Runtime root #app is missing.');
          app.textContent = 'Runtime bootstrap pending';
          EOF

      - name: Generate executor-only lockfile
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        working-directory: ci-mirror/cinematic-3d-character-website
        run: npm ci --ignore-scripts

      - name: Verify mirrored Task 7 source hashes
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          cat > task7-expected-source-sha256.txt <<'EOF'
          c00225e2fb346634ae86d2192128af383befccb8763829ad9034f04d9becdbf4  src/character/AnimationCoordinator.ts
          02ef5a840f0dfe34e60fee4a904361eed7ed2ccfa55311ea1790504e38c1739d  src/character/AnimationCoordinator.test.ts
          EOF
          sha256sum -c task7-expected-source-sha256.txt | tee task7-source-hash-check.log
          sha256sum src/character/AnimationCoordinator.ts src/character/AnimationCoordinator.test.ts > task7-source-sha256.txt

      - name: Run Task 7 targeted tests
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm test -- src/character/AnimationCoordinator.test.ts 2>&1 | tee task7-targeted-test.log

      - name: Run full unit regression
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee task7-regression-test.log

      - name: Run strict TypeScript and Vite build
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee task7-build.log

      - name: Materialize pinned zero-animation nonfinal GLB fixture
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl --fail --location --retry 2 --retry-delay 1 \
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/2bac6f8c57bf471df0d2a1e8a8ec023c7801dddf/Models/Box/glTF-Binary/Box.glb' \
            --output public/assets/test-character.glb
          echo 'ed52f7192b8311d700ac0ce80644e3852cd01537e4d62241b9acba023da3d54e  public/assets/test-character.glb' | sha256sum -c - | tee task7-fixture-hash-check.log

      - name: Create executor-only browser missing-clip smoke page
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          cat > task7-smoke.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="UTF-8" /><title>Task 7 animation fallback smoke</title></head>
            <body data-task7="pending">
              <script type="module">
                import { loadRuntimeCharacterAsset } from '/src/assets/AssetLoader.ts';
                import { TEST_CHARACTER_ASSET_MANIFEST } from '/src/assets/AssetManifest.ts';
                import { AnimationCoordinator } from '/src/character/AnimationCoordinator.ts';

                try {
                  const asset = await loadRuntimeCharacterAsset(TEST_CHARACTER_ASSET_MANIFEST);
                  const coordinator = new AnimationCoordinator(asset.root, asset.clips);
                  const result = coordinator.transitionTo('action');
                  if (asset.clips.length !== 0 || result.actualAnimationState !== 'none' || !result.usedFallback || result.transition !== 'none') {
                    throw new Error(`Unexpected fallback result: ${JSON.stringify(result)}`);
                  }
                  document.body.dataset.task7 = 'pass';
                  document.body.textContent = JSON.stringify({
                    status: 'pass',
                    clipCount: asset.clips.length,
                    desiredState: result.desiredState,
                    actualAnimationState: result.actualAnimationState,
                    usedFallback: result.usedFallback,
                    transition: result.transition,
                  });
                } catch (error) {
                  document.body.dataset.task7 = 'fail';
                  document.body.textContent = String(error);
                }
              </script>
            </body>
          </html>
          EOF

      - name: Run browser zero-animation fallback smoke
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --version | tee task7-browser-version.txt
          npx vite --host 127.0.0.1 --port 4173 > task7-vite-runtime.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/task7-smoke.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          tmp_dom="$RUNNER_TEMP/task7-browser-smoke.html"
          tmp_stderr="$RUNNER_TEMP/task7-browser-stderr.log"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:4173/task7-smoke.html > "$tmp_dom" 2> "$tmp_stderr"
          cleanup
          trap - EXIT
          cp "$tmp_dom" task7-browser-smoke.html
          cp "$tmp_stderr" task7-browser-stderr.log
          grep -q 'data-task7="pass"' task7-browser-smoke.html
          grep -q '"clipCount":0' task7-browser-smoke.html
          grep -q '"actualAnimationState":"none"' task7-browser-smoke.html
          grep -q '"usedFallback":true' task7-browser-smoke.html

      - name: Record final result
        working-directory: ci-mirror/cinematic-3d-character-website
        shell: bash
        run: |
          node --version > task7-environment.txt
          npm --version >> task7-environment.txt
          npm ls --depth=0 >> task7-environment.txt
          printf '{"targeted":"pass","regression":"pass","build":"pass","source_hash_match":true,"browser_zero_animation_fallback":"pass"}\n' > task7-result.json

      - name: Upload Task 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-task7-animation-evidence
          path: |
            ci-mirror/cinematic-3d-character-website/task7-targeted-test.log
            ci-mirror/cinematic-3d-character-website/task7-regression-test.log
            ci-mirror/cinematic-3d-character-website/task7-build.log
            ci-mirror/cinematic-3d-character-website/task7-source-sha256.txt
            ci-mirror/cinematic-3d-character-website/task7-source-hash-check.log
            ci-mirror/cinematic-3d-character-website/task7-fixture-hash-check.log
            ci-mirror/cinematic-3d-character-website/task7-browser-version.txt
            ci-mirror/cinematic-3d-character-website/task7-vite-runtime.log
            ci-mirror/cinematic-3d-character-website/task7-browser-smoke.html
            ci-mirror/cinematic-3d-character-website/task7-browser-stderr.log
            ci-mirror/cinematic-3d-character-website/task7-environment.txt
            ci-mirror/cinematic-3d-character-website/task7-result.json
          if-no-files-found: ignore
