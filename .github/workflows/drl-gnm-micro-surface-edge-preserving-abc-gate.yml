name: DRL GNM Micro Surface Edge-Preserving A/B/C Gate

on:
  push:
    branches:
      - experiment/gnm-appearance-gate
    paths:
      - 'tools/experiments/drl_gnm_micro_surface_gate.py'
      - '.github/workflows/drl-gnm-micro-surface-edge-preserving-abc-gate.yml'

permissions:
  contents: read

jobs:
  edge-preserving-abc:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Acquire pinned Google GNM v3
        run: |
          git clone --filter=blob:none https://github.com/google/GNM.git /tmp/GNM
          cd /tmp/GNM
          git checkout 98450b3c943101d5859ac1ceb7331ec918ebc321
          test "$(git rev-parse HEAD)" = "98450b3c943101d5859ac1ceb7331ec918ebc321"
          echo "868075bbb172fc6574ece89338e21fdc0efe0be91ca4e6e5c3166a1a97840055  gnm/shape/data/versions/v3_0/gnm_head.npz" | sha256sum -c -

      - name: Acquire DRL OBJ and displacement privately
        run: |
          mkdir -p /tmp/drl artifacts/drl-gnm-micro-surface-edge-preserving-abc
          URL='https://www.digitalrealitylab.com/wp-content/uploads/SampleScans/Marcus_PBR_Sample_01.zip'
          curl -L --fail --retry 3 --retry-delay 3 -A 'Mozilla/5.0' -o /tmp/Marcus_PBR_Sample_01.zip "$URL"
          test "$(stat -c%s /tmp/Marcus_PBR_Sample_01.zip)" -eq 928494471
          sha256sum /tmp/Marcus_PBR_Sample_01.zip > artifacts/drl-gnm-micro-surface-edge-preserving-abc/drl-source-archive-sha256.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/Marcus_PBR_Sample_01.zip')
          for src,dst in {
              'OBJ/Marcus_PBR_Sample_01.obj':'Marcus_PBR_Sample_01.obj',
              'Textures/Marcus_38_Displace.exr':'Marcus_38_Displace.exr',
          }.items():
              info=z.getinfo(src)
              data=z.read(info)
              Path('/tmp/drl',dst).write_bytes(data)
              print(src,len(data),f'{info.CRC:08x}')
          PY

      - name: Install CPU runtime and build consumer-domain Gaussian plus bilateral low-pass proxies
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil python3-opencv imagemagick libegl1 libgl1 libgles2
          OUT=artifacts/drl-gnm-micro-surface-edge-preserving-abc
          identify /tmp/drl/Marcus_38_Displace.exr | tee "$OUT/source-displacement-metadata.txt"
          convert -limit memory 1536MiB -limit map 3072MiB /tmp/drl/Marcus_38_Displace.exr -resize '4096x4096>' -colorspace Gray -depth 16 /tmp/drl/displace_4k.png
          identify /tmp/drl/displace_4k.png | tee "$OUT/proxy-displacement-metadata.txt"
          convert -limit memory 1536MiB -limit map 3072MiB /tmp/drl/displace_4k.png -blur '0x6' /tmp/drl/lowpass_gaussian6.png
          python3 - <<'PY'
          import cv2, json
          import numpy as np
          from PIL import Image
          from pathlib import Path
          from tools.experiments.transfer_ab_math import micro_height_from_lowpass

          src_path=Path('/tmp/drl/displace_4k.png')
          src_native=np.asarray(Image.open(src_path))
          src_dtype=src_native.dtype
          src_native_shape=list(src_native.shape)
          src_consumer=np.asarray(Image.open(src_path),dtype=np.float64)
          if src_consumer.ndim == 3:
              src_consumer=src_consumer[...,0]
          if src_consumer.ndim != 2 or min(src_consumer.shape) < 2048 or not np.isfinite(src_consumer).all():
              raise SystemExit(f'unexpected PIL consumer source: {src_consumer.shape}/{src_consumer.dtype}')

          if not np.issubdtype(src_dtype,np.integer):
              raise SystemExit(f'unsupported consumer storage dtype: {src_dtype}')
          storage_min=0
          storage_max=int(np.iinfo(src_dtype).max)
          filter_src=src_consumer.astype(np.float32)
          configs={
              'bilateral32': {'d':13,'sigmaColor':32.0,'sigmaSpace':6.0},
              'bilateral64': {'d':13,'sigmaColor':64.0,'sigmaSpace':6.0},
          }
          stats={
              'source_native_shape':src_native_shape,
              'source_native_dtype':str(src_dtype),
              'source_consumer_shape':list(src_consumer.shape),
              'source_consumer_min':float(src_consumer.min()),
              'source_consumer_max':float(src_consumer.max()),
              'source_consumer_p01':float(np.percentile(src_consumer,1)),
              'source_consumer_p50':float(np.percentile(src_consumer,50)),
              'source_consumer_p99':float(np.percentile(src_consumer,99)),
              'sigma_color_units':'PIL renderer consumer intensity domain',
              'filters':{},
              'consumer_preflight':{},
          }

          for name,cfg in configs.items():
              low=cv2.bilateralFilter(filter_src, cfg['d'], cfg['sigmaColor'], cfg['sigmaSpace'])
              if low.shape != filter_src.shape or not np.isfinite(low).all():
                  raise SystemExit(f'{name}: invalid bilateral output')
              out=np.clip(np.rint(low),storage_min,storage_max).astype(src_dtype)
              path=Path(f'/tmp/drl/lowpass_{name}.png')
              Image.fromarray(out).save(path)
              stats['filters'][name]={
                  **cfg,
                  'builder_residual_std_consumer_domain':float(np.std(src_consumer-low.astype(np.float64))),
                  'builder_residual_abs_p95_consumer_domain':float(np.percentile(np.abs(src_consumer-low.astype(np.float64)),95)),
                  'builder_residual_abs_p995_consumer_domain':float(np.percentile(np.abs(src_consumer-low.astype(np.float64)),99.5)),
              }

          variants={
              'gaussian6':Path('/tmp/drl/lowpass_gaussian6.png'),
              'bilateral32':Path('/tmp/drl/lowpass_bilateral32.png'),
              'bilateral64':Path('/tmp/drl/lowpass_bilateral64.png'),
          }
          for name,path in variants.items():
              low_consumer=np.asarray(Image.open(path),dtype=np.float64)
              if low_consumer.ndim == 3:
                  low_consumer=low_consumer[...,0]
              if low_consumer.shape != src_consumer.shape or not np.isfinite(low_consumer).all():
                  raise SystemExit(f'{name}: consumer round-trip mismatch {low_consumer.shape} vs {src_consumer.shape}')
              micro,micro_stats=micro_height_from_lowpass(src_consumer,low_consumer,percentile=99.5)
              if micro_stats['scale'] <= 0 or float(np.std(micro)) < 0.01:
                  raise SystemExit(f'{name}: consumer residual unexpectedly flat')
              stats['consumer_preflight'][name]={
                  'low_consumer_min':float(low_consumer.min()),
                  'low_consumer_max':float(low_consumer.max()),
                  'micro_height_scale_p995':float(micro_stats['scale']),
                  'micro_height_std_normalized':float(np.std(micro)),
                  'micro_height_abs_p95_normalized':float(np.percentile(np.abs(micro),95)),
              }

          Path('artifacts/drl-gnm-micro-surface-edge-preserving-abc/filter_proxy_stats.json').write_text(json.dumps(stats,indent=2))
          print(json.dumps(stats,indent=2))
          PY
          identify /tmp/drl/lowpass_gaussian6.png | tee "$OUT/lowpass_gaussian6_metadata.txt"
          identify /tmp/drl/lowpass_bilateral32.png | tee "$OUT/lowpass_bilateral32_metadata.txt"
          identify /tmp/drl/lowpass_bilateral64.png | tee "$OUT/lowpass_bilateral64_metadata.txt"

      - name: Execute fixed-condition edge-preserving A/B/C renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONPATH: ${{ github.workspace }}
          GNM_MODEL: /tmp/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
          DRL_OBJ: /tmp/drl/Marcus_PBR_Sample_01.obj
          DRL_DISPLACE_PROXY: /tmp/drl/displace_4k.png
          TRANSFER_SIZE: '1024'
        run: |
          set -euo pipefail
          OUT=artifacts/drl-gnm-micro-surface-edge-preserving-abc
          TRANSIENT=artifacts/drl-gnm-diffuse-transfer-gate
          for variant in gaussian6 bilateral32 bilateral64; do
            rm -rf "$TRANSIENT"
            mkdir -p "$TRANSIENT" "$OUT/$variant"
            export DRL_DISPLACE_LOWPASS="/tmp/drl/lowpass_${variant}.png"
            blender --background --python tools/experiments/drl_gnm_micro_surface_gate.py
            test -s "$TRANSIENT/diffuse_transfer_metrics.json"
            test -s "$TRANSIENT/00_drl_gnm_diffuse_transfer_contact_sheet.jpg"
            cp "$TRANSIENT/diffuse_transfer_metrics.json" "$OUT/$variant/"
            cp "$TRANSIENT/00_drl_gnm_diffuse_transfer_contact_sheet.jpg" "$OUT/$variant/"
            for f in front.png three_quarter_right.png three_quarter_left.png side_right.png face_close.png face_3q_close.png; do
              test -s "$TRANSIENT/$f"
              cp "$TRANSIENT/$f" "$OUT/$variant/$f"
            done
          done

      - name: Enforce numeric contract fixed invariants and builder-consumer parity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('artifacts/drl-gnm-micro-surface-edge-preserving-abc')
          preflight=json.loads((root/'filter_proxy_stats.json').read_text())['consumer_preflight']
          variants={'A_Gaussian6':'gaussian6','B_Bilateral32':'bilateral32','C_Bilateral64':'bilateral64'}
          loaded={}
          for name,folder in variants.items():
              m=json.loads((root/folder/'diffuse_transfer_metrics.json').read_text())
              loaded[name]=m
              a=m['appearance_decomposition']
              if a['identity_diffuse_used']:
                  raise SystemExit(f'{name}: identity diffuse leaked')
              if not a['lowpass_removed']:
                  raise SystemExit(f'{name}: lowpass removal flag missing')
              if a['micro_height_abs_p95_normalized'] <= 0.01:
                  raise SystemExit(f'{name}: residual is flat')
              if m['correspondence']['valid_fraction'] < 0.70:
                  raise SystemExit(f'{name}: correspondence too small')
              if m['blend']['invalid_correspondence_nonzero_alpha'] != 0:
                  raise SystemExit(f'{name}: invalid correspondence leaked')
              if not m['decision']['pass']:
                  raise SystemExit(f'{name}: numeric gate failed')
              if abs(float(a['bump_distance_mm'])-0.35) > 1e-12 or abs(float(a['bump_strength'])-0.32) > 1e-12:
                  raise SystemExit(f'{name}: bump contract drifted')
              renderer_scale=float(a['micro_height_stats']['scale'])
              expected_scale=float(preflight[folder]['micro_height_scale_p995'])
              if abs(renderer_scale-expected_scale) > 1e-9:
                  raise SystemExit(f'{name}: builder-consumer parity failed {renderer_scale} != {expected_scale}')

          ref=loaded['A_Gaussian6']
          invariant_paths={
              'valid_fraction':lambda m:m['correspondence']['valid_fraction'],
              'ray_accepted_pixels':lambda m:m['correspondence']['ray_accepted_pixels'],
              'safe_nearest_fallback_pixels':lambda m:m['correspondence']['safe_nearest_fallback_pixels'],
              'full_alpha_core_fraction':lambda m:m['blend']['full_alpha_core_fraction'],
              'bump_distance_mm':lambda m:m['appearance_decomposition']['bump_distance_mm'],
              'bump_strength':lambda m:m['appearance_decomposition']['bump_strength'],
          }
          invariants={k:f(ref) for k,f in invariant_paths.items()}
          for name,m in loaded.items():
              for k,f in invariant_paths.items():
                  v=f(m); rv=invariants[k]
                  if isinstance(rv,float):
                      if abs(float(v)-float(rv)) > 1e-12:
                          raise SystemExit(f'{name}: invariant {k} drifted')
                  elif v != rv:
                      raise SystemExit(f'{name}: invariant {k} drifted')

          summary={
              'gate':'DRL_GNM_MICRO_SURFACE_EDGE_PRESERVING_ABC',
              'representation_parity':'PASS',
              'variants':{},
              'fixed_invariants':invariants,
              'automatic_winner':None,
              'visual_decision':'PENDING_GPT_VISUAL_REVIEW',
              'visual_criteria':['oval_scar_suppression','pore_retention','fine_wrinkle_retention','new_filter_artifacts','whole_face_uniformity'],
          }
          for name,m in loaded.items():
              a=m['appearance_decomposition']
              folder=variants[name]
              summary['variants'][name]={
                  'preflight_micro_height_raw_scale_p995':preflight[folder]['micro_height_scale_p995'],
                  'renderer_micro_height_raw_scale_p995':a['micro_height_stats']['scale'],
                  'micro_height_std_normalized':a['micro_height_std_normalized'],
                  'micro_height_abs_p95_normalized':a['micro_height_abs_p95_normalized'],
                  'micro_height_abs_p99_normalized':a['micro_height_abs_p99_normalized'],
                  'numeric_pass':m['decision']['pass'],
              }
          (root/'edge_preserving_summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Build edge-preserving A/B/C visual comparison sheets
        run: |
          OUT=artifacts/drl-gnm-micro-surface-edge-preserving-abc
          montage \
            -label 'A = Gaussian 6' "$OUT/gaussian6/face_close.png" \
            -label 'B = Bilateral 32' "$OUT/bilateral32/face_close.png" \
            -label 'C = Bilateral 64' "$OUT/bilateral64/face_close.png" \
            -tile 3x1 -geometry '+8+8' -background white "$OUT/ABC_face_close.jpg"
          montage \
            -label 'A = Gaussian 6' "$OUT/gaussian6/face_3q_close.png" \
            -label 'B = Bilateral 32' "$OUT/bilateral32/face_3q_close.png" \
            -label 'C = Bilateral 64' "$OUT/bilateral64/face_3q_close.png" \
            -tile 3x1 -geometry '+8+8' -background white "$OUT/ABC_face_3q_close.jpg"
          montage \
            -label 'A = Gaussian 6' "$OUT/gaussian6/front.png" \
            -label 'B = Bilateral 32' "$OUT/bilateral32/front.png" \
            -label 'C = Bilateral 64' "$OUT/bilateral64/front.png" \
            -tile 3x1 -geometry '+8+8' -background white "$OUT/ABC_front.jpg"
          montage \
            -label 'A = Gaussian 6' "$OUT/gaussian6/three_quarter_right.png" \
            -label 'B = Bilateral 32' "$OUT/bilateral32/three_quarter_right.png" \
            -label 'C = Bilateral 64' "$OUT/bilateral64/three_quarter_right.png" \
            -tile 3x1 -geometry '+8+8' -background white "$OUT/ABC_three_quarter_right.jpg"
          for f in ABC_face_close.jpg ABC_face_3q_close.jpg ABC_front.jpg ABC_three_quarter_right.jpg edge_preserving_summary.json filter_proxy_stats.json; do
            test -s "$OUT/$f"
          done

      - name: Assert no raw or derived DRL appearance maps are redistributed
        run: |
          OUT=artifacts/drl-gnm-micro-surface-edge-preserving-abc
          ! find "$OUT" -type f \( -iname '*.obj' -o -iname '*.fbx' -o -iname '*.ztl' -o -iname '*.psd' -o -iname '*.exr' \) | grep .
          ! find "$OUT" -type f \( -iname 'displace_4k.png' -o -iname 'lowpass_*.png' -o -iname '*micro_height*.png' \) | grep .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl-gnm-micro-surface-edge-preserving-abc-gate
          path: artifacts/drl-gnm-micro-surface-edge-preserving-abc/
          retention-days: 14
